root: "../../out"
schema_version: 1

dataset:
  name: "mur_laureati"
  source_id: "mur_ustat"
  tags: [istruzione, mur, laureati, universita]
  category: istruzione
  years: [2025]
  time_coverage:
    mode: full_series
    start_year: 2001
    end_year: 2025

support:
  - name: "mur_anagrafica_atenei"
    config: "../../support/anagrafica-atenei/dataset.yml"
    years: [2025]

raw:
  output_policy: overwrite
  sources:
    - name: "laureati_ateneo"
      type: "ckan"
      args:
        portal_url: "https://dati-ustat.mur.gov.it/api/3/action"
        resource_id: "88acd482-9d75-44d1-ab16-aa04524f5d94"
        filename: "laureati_ateneo.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  required_columns: [anno, ateneo_cod, ateneo_nome, sesso, laureati, macro_area, provincia, regione]
  read:
    source: auto
    mode: latest
    delim: ","
    encoding: utf-8
    header: true
  validate:
    not_null: [anno]
    min_rows: 1000

mart:
  tables:
    - name: "mart_laureati_efficienza"
      sql: "sql/mart.sql"
  required_tables: ["mart_laureati_efficienza"]
  validate:
    table_rules:
      mart_laureati_efficienza:
        required_columns: [anno, ateneo_cod, ateneo_nome, macro_area, totale, share_nazionale, ranking]
        primary_key: [anno, ateneo_cod]
        not_null: [anno, ateneo_cod, totale]
        min_rows: 500

validation:
  fail_on_error: true
