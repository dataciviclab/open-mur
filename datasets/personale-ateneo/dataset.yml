root: "../../out"
schema_version: 1

dataset:
  name: "mur_personale_ateneo"
  source_id: "mur_ustat"
  tags: [istruzione, mur, personale, docenti, ricercatori, ateneo, bilancio-genere]
  category: istruzione
  years: [2025]
  time_coverage:
    mode: full_series
    start_year: 2012
    end_year: 2024

support:
  - name: "mur_anagrafica_atenei"
    config: "../../support/anagrafica-atenei/dataset.yml"
    years: [2025]

raw:
  output_policy: overwrite
  sources:
    - name: "personale_accademico_profilo"
      type: "ckan"
      args:
        portal_url: "https://dati-ustat.mur.gov.it/api/3/action"
        resource_id: "6027508d-2efd-4f86-bbbf-44cb914b29c2"
        filename: "personale_accademico_profilo.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  required_columns: [anno, cod_ateneo, nome_ateneo, regione, area_geo, macro_area, grade, genere, classe_eta, numero]
  read:
    source: auto
    mode: latest
    delim: ","
    encoding: utf-8
    header: true
  validate:
    not_null: [anno]
    min_rows: 1000

mart:
  tables:
    - name: "mart_personale_per_ateneo"
      sql: "sql/mart_per_ateneo.sql"
    - name: "mart_personale_per_grade"
      sql: "sql/mart_per_grade.sql"
  required_tables: ["mart_personale_per_ateneo", "mart_personale_per_grade"]
  validate:
    table_rules:
      mart_personale_per_ateneo:
        primary_key: [anno, cod_ateneo, grade, genere]
        not_null: [anno, cod_ateneo, grade, genere, totale]
        min_rows: 500
      mart_personale_per_grade:
        primary_key: [anno, grade]
        not_null: [anno, grade, totale]
        min_rows: 50

validation:
  fail_on_error: true
