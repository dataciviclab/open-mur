root: "../../out"
schema_version: 1

dataset:
  name: "mur_contribuzione_universitaria"
  source_id: "mur_ustat"
  tags: [istruzione, mur, contribuzione, universitaria]
  category: istruzione
  years: [2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024]

raw:
  sources:
    - name: "mur_gettito_ckan"
      type: "ckan"
      args:
        portal_url: "https://dati-ustat.mur.gov.it/api/3/action"
        dataset_id: "{year}-contribuzione-e-interventi-atenei"
        resource_name: "{year} Gettito della contribuzione studentesca"
        filename: "gettito_{year}.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  required_columns: [anno, cod_ateneo, nome_ateneo, codice_gettito, descrizione_gettito]
  read:
    source: "auto"
    mode: "latest"
    header: true
  validate:
    not_null: [anno]
    min_rows: 800

mart:
  tables:
    - name: "mart_contribuzione_trend"
      sql: "sql/mart.sql"
  required_tables: ["mart_contribuzione_trend"]
  validate:
    table_rules:
      mart_contribuzione_trend:
        required_columns: [anno, descrizione_gettito, totale_euro, milioni]
        primary_key: [anno, descrizione_gettito]
        not_null: [anno, descrizione_gettito, totale_euro]
        min_rows: 10

validation:
  fail_on_error: true
