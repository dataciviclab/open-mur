root: "../../out"
schema_version: 1

dataset:
  name: "mur_iscritti"
  source_id: "mur_ustat"
  tags: [istruzione, mur, iscritti]
  category: istruzione
  years: [2025]
  time_coverage:
    mode: full_series
    start_year: 2000
    end_year: 2025

support:
  - name: "mur_anagrafica_atenei"
    config: "../../support/anagrafica-atenei/dataset.yml"
    years: [2025]

raw:
  sources:
    - name: "iscritti_ateneo"
      type: "ckan"
      args:
        portal_url: "https://dati-ustat.mur.gov.it/api/3/action"
        resource_id: "32d26e28-a0b5-45f3-9152-6072164f3e63"
        filename: "iscritti_ateneo.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  required_columns: [anno, ateneo_cod, ateneo_nome, sesso, iscritti, macro_area, provincia, regione]
  read:
    mode: latest
    source: auto
    delim: ","
    encoding: utf-8
    header: true
  validate:
    not_null: [anno]
    min_rows: 3000

mart:
  tables:
    - name: "mart_iscritti_concentrazione"
      sql: "sql/mart.sql"
  required_tables: ["mart_iscritti_concentrazione"]
  validate:
    table_rules:
      mart_iscritti_concentrazione:
        required_columns: [anno, ateneo_cod, ateneo_nome, macro_area, totale, share_nazionale, ranking]
        primary_key: [anno, ateneo_cod]
        not_null: [anno, ateneo_cod, totale]
        min_rows: 500

validation:
  fail_on_error: true
