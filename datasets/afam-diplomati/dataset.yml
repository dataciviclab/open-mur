root: "../../out"
schema_version: 1

dataset:
  name: "mur_afam_diplomati"
  source_id: "mur_ustat"
  tags: [istruzione, afam, diplomati, accademie, conservatori]
  category: istruzione
  years: [2025]
  time_coverage:
    mode: full_series
    start_year: 2010
    end_year: 2025

support:
  - name: "mur_afam_istituti"
    config: "../../support/anagrafica-afam/dataset.yml"
    years: [2025]

raw:
  output_policy: overwrite
  sources:
    - name: "diplomati_afam_2010_2019"
      type: "ckan"
      args:
        portal_url: "https://dati-ustat.mur.gov.it/api/3/action"
        resource_id: "df8f3d8c-6562-4412-b1c7-5023f31999d8"
        filename: "afam_diplomati_2010_2019.csv"
      primary: true
    - name: "diplomati_afam_2020_2025"
      type: "ckan"
      args:
        portal_url: "https://dati-ustat.mur.gov.it/api/3/action"
        resource_id: "9efc90fb-d5a1-4623-b857-10ef07d95583"
        filename: "afam_diplomati_2020_2025.csv"

clean:
  sql: "sql/clean.sql"
  required_columns: [anno, cod_istituto, nome_istituto, area_istituto, area_corso, tipo_corso, classe, corso, genere, diplomati, regione]
  read:
    source: auto
    mode: all
    delim: ","
    encoding: "utf-8"
    header: true
  validate:
    not_null: [anno, cod_istituto]
    min_rows: 50000

mart:
  tables:
    - name: "mart_afam_diplomati_area"
      sql: "sql/mart.sql"
  required_tables: ["mart_afam_diplomati_area"]
  validate:
    table_rules:
      mart_afam_diplomati_area:
        required_columns: [anno, area_corso, totale, donne, uomini, pct_donne, share_anno]
        primary_key: [anno, area_corso]
        not_null: [anno, area_corso, totale]
        min_rows: 20

validation:
  fail_on_error: true
