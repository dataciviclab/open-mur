root: "../../out"
schema_version: 1

dataset:
  name: "mur_immatricolati"
  source_id: "mur_ustat"
  tags: [istruzione, mur, immatricolati]
  category: istruzione
  years: [2025]
  time_coverage:
    mode: full_series
    start_year: 1998
    end_year: 2025

raw:
  output_policy: overwrite
  sources:
    - name: "immatricolati_classe"
      type: "ckan"
      args:
        portal_url: "https://dati-ustat.mur.gov.it/api/3/action"
        resource_id: "9bb0cf6d-1d4e-47f3-8ae9-0c665617b158"
        filename: "immatricolati_classe.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  required_columns: [anno, classe_cod, classe_nome, sesso, immatricolati]
  read:
    mode: latest
    source: auto
    delim: ","
    encoding: utf-8
    header: true
  validate:
    not_null: [anno]
    min_rows: 3000

mart:
  tables:
    - name: "mart_immatricolati_area"
      sql: "sql/mart.sql"
  required_tables: ["mart_immatricolati_area"]
  validate:
    table_rules:
      mart_immatricolati_area:
        required_columns: [anno, classe_cod, classe_nome, totale, donne, uomini, pct_donne, share_totale]
        primary_key: [anno, classe_cod]
        not_null: [anno, classe_cod, totale]
        min_rows: 500

validation:
  fail_on_error: true
