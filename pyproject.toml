[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dataciviclab-open-mur"
version = "0.1.0"
description = "Intelligence sulle università italiane — dati MUR/USTAT"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "DataCivicLab" }]

# duckdb: dipendenza runtime (usata dai test SQL e dal motore). toolkit non è
# importato (CLI esterno) → vive nell'extra `pipeline`; lab-connectors arriva
# transitivamente da toolkit (non si dichiara).
dependencies = [
    "duckdb>=1.5.3,<2",
]

# Nessun package Python: il repo è dati + SQL + scripts.
# Esplicito per evitare il flat-layout discovery di setuptools.
[tool.setuptools]
packages = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]
pipeline = [
    "dataciviclab-toolkit @ git+https://github.com/dataciviclab/toolkit.git",
]
# Catalog engine per-repo (probe, inventory, source report).
observatory = [
    "dataciviclab-source-observatory[validate] @ git+https://github.com/dataciviclab/source-observatory.git@main",
]
dashboard = [
    "streamlit>=1.61",
    "plotly>=5.18",
    "altair>=6.2",
    "pandas>=3.0",
    "duckdb>=1.5.3",
    "lab-connectors[duckdb] @ git+https://github.com/dataciviclab/lab-connectors.git",
]

[project.urls]
Home = "https://github.com/dataciviclab/open-mur"

[tool.pytest.ini_options]
markers = [
    "contract: interfaccia pubblica, artifact format, contratto API, schema output",
    "policy: regola Lab non ovvia o comportamento cross-component",
    "regression: bug fix documentato in issue/PR",
    "adapter: adapter a servizio esterno (CKAN, HTTP)",
    "pure_unit: logica pura non banale, zero side effect",
    "smoke: test che fa chiamate reali (richiede connettivita')",
]

[tool.toolkit.extends]
source_id = "mur_ustat"

[tool.observatory]
source_id = "mur_ustat"
protocol = "ckan"
base_url = "https://dati-ustat.mur.gov.it/api/3/action/package_list?limit=1"
observation_mode = "catalog-watch"
verdict = "go"
note = "CKAN diretto dati-ustat.mur.gov.it (il repo consuma resource_id specifici di questo portale, non dell'aggregato dati.gov.it)."
