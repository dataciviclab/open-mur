name: Pipeline

on:
  pull_request:
    types: [closed]
    paths:
      - "datasets/**"
      - "support/**"
  schedule:
    # Mensile: refresh completo (propaga i support e riallinea le fonti)
    - cron: "0 6 1 * *"
  workflow_dispatch:
    inputs:
      datasets:
        description: "Uno o più slug separati da virgola (o path del dataset.yml). Vuoto = tutti. Vedi ADR-002."
        required: false
        default: ""

concurrency:
  group: open-mur-pipeline-${{ github.event.pull_request.number || github.ref || 'schedule' }}
  cancel-in-progress: false

jobs:
  pipeline:
    if: github.event.pull_request.merged == true || github.event_name != 'pull_request'
    uses: dataciviclab/.github/.github/workflows/pipeline-reusable.yml@main
    with:
      repo-slug: "open_mur"
      run-command: >-
        ${{ inputs.datasets == '' && 'make run-all' || format('for d in $(echo "{0}" | tr "," " "); do toolkit run --config "$d"; done', inputs.datasets) }}
      run-batch-command: "make run-batch"
      detect-paths: "datasets support"
      extra-env: "BLOCKED_SOURCE_PROXY=${{ vars.BLOCKED_SOURCE_PROXY }}"
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    secrets: inherit
