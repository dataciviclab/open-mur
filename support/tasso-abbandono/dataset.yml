root: "../../out"
schema_version: 1

dataset:
  name: "mur_tasso_abbandono"
  source_id: "mur_ustat"
  tags: [istruzione, mur, abbandono, efficienza, support]
  category: support
  description: "Tasso di abbandono entro il 1° anno di università, serie storica 2011-2025."
  years: [2025]
  time_coverage:
    mode: full_series
    start_year: 2011
    end_year: 2025

raw:
  sources:
    - name: "tasso_abbandono"
      type: "ckan"
      args:
        portal_url: "https://dati-ustat.mur.gov.it/api/3/action"
        resource_id: "770cff80-d35d-4476-b273-615666836a99"
        filename: "tasso_abbandono.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  required_columns: [anno_accademico, tasso_m, tasso_f, tasso_totale]
  read:
    source: auto
    mode: latest
    delim: ","
    encoding: utf-8
    header: true
  validate:
    not_null: [anno_accademico]
    min_rows: 10

mart:
  tables:
    - name: "mart_tasso_abbandono"
      sql: "sql/mart.sql"
  required_tables: ["mart_tasso_abbandono"]
  validate:
    table_rules:
      mart_tasso_abbandono:
        required_columns: [anno_accademico, tasso_m, tasso_f, tasso_totale, gap_genere]
        primary_key: [anno_accademico]
        not_null: [anno_accademico, tasso_totale]
        min_rows: 10

validation:
  fail_on_error: true
