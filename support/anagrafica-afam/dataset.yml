root: "../../out"
schema_version: 1

dataset:
  name: "mur_afam_istituti"
  source_id: "mur_ustat"
  tags: [istruzione, afam, anagrafica, istituti, accademie, conservatori, support]
  category: support
  description: "Anagrafica istituti AFAM: codice, tipo, area, sede, regione/provincia ISTAT."
  years: [2025]

raw:
  sources:
    - name: "afam_istituti"
      type: "ckan"
      client:
        timeout: 15
        retries: 1
      args:
        portal_url: "https://dati-ustat.mur.gov.it/api/3/action"
        resource_id: "f15d64cb-ad61-4503-a60c-f1486158893b"
        filename: "afam_istituti.csv"
      primary: true

clean:
  sql: "sql/clean.sql"
  required_columns: [cod_istituto, nome_istituto, tipo_istituto, area_istituto, comune_sede, cod_reg_istat, regione, cod_prov_istat, provincia]
  read:
    source: auto
    mode: latest
    delim: ","
    encoding: "utf-8"
    header: true
  validate:
    not_null: [cod_istituto]
    min_rows: 150

mart:
  tables:
    - name: "mart_afam_istituti"
      sql: "sql/mart.sql"
  required_tables: ["mart_afam_istituti"]
  validate:
    table_rules:
      mart_afam_istituti:
        required_columns: [cod_istituto, nome_istituto, tipo_istituto, area_istituto, comune_sede, cod_reg_istat, regione, cod_prov_istat, provincia]
        primary_key: [cod_istituto, id_istituto, comune_sede]
        not_null: [cod_istituto, nome_istituto]
        min_rows: 150

validation:
  fail_on_error: true
